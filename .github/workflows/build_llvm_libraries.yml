name: Reusable workflow — build LLVM libraries

on:
  workflow_call:
    inputs:
      llvm_branch:
        required: false
        type: string
        default: "llvmorg-18.1.8"
    outputs:
      llvm_branch:
        description: "The LLVM branch that was built (for cache key reconstruction)"
        value: ${{ jobs.build.outputs.llvm_branch }}

jobs:
  build:
    name: "LLVM (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-llvm-${{ matrix.name }}
      cancel-in-progress: false
    outputs:
      llvm_branch: ${{ inputs.llvm_branch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-15
            extra_cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DLLVM_ENABLE_ZSTD=OFF"
          - name: macos-x64
            os: macos-15
            extra_cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DLLVM_ENABLE_ZSTD=OFF"
          - name: windows-x64
            os: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      # Cache key format: llvm-{name}-{branch}
      # Callers that need to restore this cache can reconstruct the key
      # from the same matrix name and branch.
      - name: Cache LLVM libraries
        id: cache-llvm
        uses: tespkg/actions-cache@v1.10.0
        with:
          endpoint: ${{ vars.CACHE_ENDPOINT }}
          accessKey: ${{ secrets.CACHE_ACCESS_KEY }}
          secretKey: ${{ secrets.CACHE_ACCESS_SECRET }}
          bucket: ${{ secrets.CACHE_BUCKET }}
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.name }}-${{ inputs.llvm_branch }}

      - name: Cache ccache (Linux)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-llvm-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-llvm-${{ matrix.name }}-

      - name: Cache ccache (macOS)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-llvm-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-llvm-${{ matrix.name }}-

      - name: Cache ccache (Windows)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-llvm-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-llvm-${{ matrix.name }}-

      - name: Install build tools (Linux)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt install -y ccache ninja-build

      - name: Install build tools (macOS)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ccache ninja

      - name: Install build tools (Windows)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: bash
        run: choco install -y ccache ninja

      - name: Install Python deps
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 -m pip install -r wamr/build-scripts/requirements.txt --break-system-packages
          else
            python3 -m pip install -r wamr/build-scripts/requirements.txt
          fi

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: python3 ./wamr/build-scripts/build_llvm.py --extra-cmake-flags="${{ matrix.extra_cmake_flags || '' }}"
        timeout-minutes: 120
