name: unity-aot

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  LLVM_BRANCH: llvmorg-18.1.8

jobs:
  # ---------------------------------------------------------------
  # Build LLVM libraries (cached, shared with unity.yml)
  # ---------------------------------------------------------------
  build-llvm-linux:
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: ubuntu-22.04
  build-llvm-macos:
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: macos-15
  build-llvm-windows:
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: windows-2022

  # ---------------------------------------------------------------
  # Build AOT compiler + runtime
  # ---------------------------------------------------------------
  build-aot:
    name: "AOT (${{ matrix.name }})"
    needs: [build-llvm-linux, build-llvm-macos, build-llvm-windows]
    runs-on: ${{ matrix.os }}
    env:
      ZERO_AR_DATE: 1
      SOURCE_DATE_EPOCH: 0
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            artifact: linux-x64-aot
            os: ubuntu-22.04
            flags: "-GNinja"
            test: true
          - name: macos-arm64
            artifact: macos-arm64-aot
            os: macos-15
            xcode: '16.4'
          - name: windows-x64
            artifact: windows-x64-aot
            os: windows-2022
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON"
            test: true

    steps:
      - name: Setup Xcode
        if: matrix.xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Deterministic Environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Restore LLVM cache
        uses: actions/cache/restore@v5
        with:
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_BRANCH }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist
          -DWAMR_BUILD_AOT_COMPILER=ON
          ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build binaryen
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel --target binaryen

      - name: Test
        if: matrix.test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix dist

      - name: Install binaryen
        shell: bash
        run: |
          mkdir -p dist/lib dist/bin
          if [ -f build/binaryen/lib/libbinaryen.so ]; then
            cp build/binaryen/lib/libbinaryen.so dist/lib/
          elif [ -f build/binaryen/lib/libbinaryen.dylib ]; then
            cp build/binaryen/lib/libbinaryen.dylib dist/lib/
          elif [ -f build/binaryen/bin/binaryen.dll ]; then
            cp build/binaryen/bin/binaryen.dll dist/bin/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
