name: unity-aot

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  ZERO_AR_DATE: 1
  SOURCE_DATE_EPOCH: 0
  LLVM_BRANCH: llvmorg-18.1.8

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build LLVM libraries (cached)
  # ---------------------------------------------------------------
  build-llvm:
    name: "LLVM (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            cache_path_ccache: ~/.cache/ccache
          - name: macos-arm64
            os: macos-15
            cache_path_ccache: ~/Library/Caches/ccache
          - name: windows-x64
            os: windows-2022
            shell: bash
            cache_path_ccache: ~/.cache/ccache

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Cache LLVM libraries
        id: cache-llvm
        uses: actions/cache@v5
        with:
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.name }}-${{ env.LLVM_BRANCH }}

      - name: Cache ccache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache_path_ccache }}
          key: ccache-llvm-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-llvm-${{ matrix.name }}-

      - name: Install build tools (Linux)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt install -y ccache ninja-build

      - name: Install build tools (macOS)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ccache ninja

      - name: Install build tools (Windows)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: choco install -y ccache ninja

      - name: Install Python deps
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 -m pip install -r wamr/build-scripts/requirements.txt --break-system-packages
          else
            python3 -m pip install -r wamr/build-scripts/requirements.txt
          fi

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: python3 ./wamr/build-scripts/build_llvm.py
        timeout-minutes: 120

  # ---------------------------------------------------------------
  # Job 2: Build AOT compiler + runtime
  # ---------------------------------------------------------------
  build-aot:
    name: "AOT (${{ matrix.name }})"
    needs: build-llvm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            artifact: linux-x64-aot
            os: ubuntu-22.04
            flags: "-GNinja"
            test: true
          - name: macos-arm64
            artifact: macos-arm64-aot
            os: macos-15
            xcode: '16.4'
          - name: windows-x64
            artifact: windows-x64-aot
            os: windows-2022
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON"
            test: true

    steps:
      - name: Setup Xcode
        if: matrix.xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Deterministic Environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Restore LLVM cache
        uses: actions/cache/restore@v5
        with:
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.name }}-${{ env.LLVM_BRANCH }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist
          -DWAMR_BUILD_AOT_COMPILER=ON
          ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build binaryen
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel --target binaryen

      - name: Test
        if: matrix.test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix dist

      - name: Install binaryen
        shell: bash
        run: |
          mkdir -p dist/lib dist/bin
          if [ -f build/binaryen/lib/libbinaryen.so ]; then
            cp build/binaryen/lib/libbinaryen.so dist/lib/
          elif [ -f build/binaryen/lib/libbinaryen.dylib ]; then
            cp build/binaryen/lib/libbinaryen.dylib dist/lib/
          elif [ -f build/binaryen/bin/binaryen.dll ]; then
            cp build/binaryen/bin/binaryen.dll dist/bin/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
