name: unity-aot

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------
  # Build LLVM libraries (cached, shared with unity.yml)
  # ---------------------------------------------------------------
  build-llvm:
    uses: ./.github/workflows/build_llvm_libraries.yml

  # ---------------------------------------------------------------
  # Build binaryen (cached, shared with unity.yml)
  # ---------------------------------------------------------------
  build-binaryen:
    uses: ./.github/workflows/build_binaryen.yml

  # ---------------------------------------------------------------
  # Build AOT compiler + runtime
  # ---------------------------------------------------------------
  build-aot:
    name: "AOT (${{ matrix.name }})"
    needs: [build-llvm, build-binaryen]
    runs-on: ${{ matrix.os }}
    env:
      ZERO_AR_DATE: 1
      SOURCE_DATE_EPOCH: 0
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            artifact: linux-x64-aot
            os: ubuntu-22.04
            flags: "-GNinja"
            test: true
          - name: macos-arm64
            artifact: macos-arm64-aot
            os: macos-15
            xcode: '16.4'
          - name: windows-x64
            artifact: windows-x64-aot
            os: windows-2022
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON"
            test: true

    steps:
      - name: Setup Xcode
        if: matrix.xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Deterministic Environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Restore LLVM cache
        uses: actions/cache/restore@v5
        with:
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.name }}-${{ needs.build-llvm.outputs.llvm_branch }}
          fail-on-cache-miss: true

      - name: Restore binaryen cache
        uses: actions/cache/restore@v5
        with:
          path: binaryen-install
          key: binaryen-${{ matrix.name }}-${{ needs.build-binaryen.outputs.binaryen_version }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist
          -DWAMR_BUILD_AOT_COMPILER=ON
          -DBINARYEN_ROOT=${{ github.workspace }}/binaryen-install
          ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        if: matrix.test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
