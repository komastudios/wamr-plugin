name: unity

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------
  # Build LLVM libraries (cached, shared with unity_aot.yml)
  # ---------------------------------------------------------------
  build-llvm:
    uses: ./.github/workflows/build_llvm_libraries.yml

  # ---------------------------------------------------------------
  # Build binaryen (cached, shared with unity_aot.yml)
  # ---------------------------------------------------------------
  build-binaryen:
    uses: ./.github/workflows/build_binaryen.yml

  # ---------------------------------------------------------------
  # Build WAMR runtime + binaryen for all platforms
  # ---------------------------------------------------------------
  build:
    needs: [build-llvm, build-binaryen]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ZERO_AR_DATE: 1
      SOURCE_DATE_EPOCH: 0
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Desktop fast-interp (all platforms) ---
          - name: "Linux fast-interp"
            artifact: "linux-x64-fast-interp"
            platform: "linux-x64"
            os: ubuntu-22.04
            desktop: true
            flags: "-GNinja -DWAMR_LIB_SUFFIX=-fast-interp"
            test: true
          - name: "macOS arm64 fast-interp"
            artifact: "macos-arm64-fast-interp"
            platform: "macos-arm64"
            os: macos-15
            desktop: true
            xcode: '16.4'
            flags: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DWAMR_LIB_SUFFIX=-fast-interp"
          - name: "macOS x86_64 fast-interp"
            artifact: "macos-x64-fast-interp"
            platform: "macos-x64"
            os: macos-15
            desktop: true
            xcode: '16.4'
            flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DWAMR_LIB_SUFFIX=-fast-interp"
          - name: "Windows fast-interp"
            artifact: "windows-x64-fast-interp"
            platform: "windows-x64"
            os: windows-2022
            desktop: true
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON -DWAMR_LIB_SUFFIX=-fast-interp"
            test: true

          # --- Desktop llvm-jit (all desktop platforms) ---
          - name: "Linux llvm-jit"
            artifact: "linux-x64-llvm-jit"
            platform: "linux-x64"
            os: ubuntu-22.04
            desktop: true
            llvm: true
            flags: "-GNinja -DWAMR_LIB_SUFFIX=-llvm-jit"
            jit_flags: "-DBUILD_JIT=ON -DBUILD_AOT=ON"
            test: true
          - name: "macOS arm64 llvm-jit"
            artifact: "macos-arm64-llvm-jit"
            platform: "macos-arm64"
            os: macos-15
            desktop: true
            llvm: true
            xcode: '16.4'
            flags: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DWAMR_LIB_SUFFIX=-llvm-jit"
            jit_flags: "-DBUILD_JIT=ON -DBUILD_AOT=ON"
          - name: "macOS x86_64 llvm-jit"
            artifact: "macos-x64-llvm-jit"
            platform: "macos-x64"
            os: macos-15
            desktop: true
            llvm: true
            xcode: '16.4'
            flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DWAMR_LIB_SUFFIX=-llvm-jit"
            jit_flags: "-DBUILD_JIT=ON -DBUILD_AOT=ON"
          - name: "Windows llvm-jit"
            artifact: "windows-x64-llvm-jit"
            platform: "windows-x64"
            os: windows-2022
            desktop: true
            llvm: true
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON -DWAMR_LIB_SUFFIX=-llvm-jit"
            jit_flags: "-DBUILD_JIT=ON -DBUILD_AOT=ON"
            test: true

          # --- Desktop fast-jit (Linux x86_64 only) ---
          - name: "Linux fast-jit"
            artifact: "linux-x64-fast-jit"
            platform: "linux-x64"
            os: ubuntu-22.04
            desktop: true
            flags: "-GNinja -DWAMR_LIB_SUFFIX=-fast-jit"
            jit_flags: "-DBUILD_FAST_JIT=ON"
            test: true

          # --- Android ---
          - name: Android (arm64-v8a)
            artifact: "android-arm64"
            os: ubuntu-22.04
            android: true
            abi: "arm64-v8a"
          - name: Android (armeabi-v7a)
            artifact: "android-armv7"
            os: ubuntu-22.04
            android: true
            abi: "armeabi-v7a"
            flags: "-DANDROID_ARM_NEON=ON"
          - name: Android (x86)
            artifact: "android-x86"
            os: ubuntu-22.04
            android: true
            abi: "x86"
          - name: Android (x86_64)
            artifact: "android-x86_64"
            os: ubuntu-22.04
            android: true
            abi: "x86_64"

          # --- iOS ---
          - name: iOS
            artifact: "ios-arm64"
            os: macos-15
            ios: true
            xcode: '16.4'
            flags: >-
              -GXcode
              -DCMAKE_SYSTEM_NAME=iOS
              "-DCMAKE_OSX_ARCHITECTURES=arm64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
              -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO
              -DCMAKE_IOS_INSTALL_COMBINED=NO
              -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # --- Web (Emscripten) ---
          - name: Emscripten (wasm32)
            artifact: "emscripten-wasm"
            os: ubuntu-22.04
            emscripten: true

    steps:
      - name: Setup Xcode
        if: matrix.xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Deterministic Environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Set up NDK
        if: matrix.android
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r23b

      - name: Set up Emscripten
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.8

      # --- Authenticate and restore pre-built dependencies (desktop only) ---

      - name: Authenticate to Google Cloud
        if: matrix.desktop
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Restore LLVM cache
        if: matrix.llvm
        uses: komastudios/actions-cache-gcs/restore@v1
        with:
          bucket: ${{ vars.CACHE_BUCKET }}
          use-fallback: false
          fail-on-cache-miss: true
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.platform }}-${{ needs.build-llvm.outputs.llvm_branch }}

      - name: Restore binaryen cache
        if: matrix.desktop
        uses: komastudios/actions-cache-gcs/restore@v1
        with:
          bucket: ${{ vars.CACHE_BUCKET }}
          use-fallback: false
          fail-on-cache-miss: true
          path: binaryen-install
          key: binaryen-${{ matrix.platform }}-${{ needs.build-binaryen.outputs.binaryen_version }}

      # --- Standard (Linux, Windows, macOS) ---

      - name: Configure CMake (Standard)
        if: "!matrix.android && !matrix.emscripten"
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/dist
          ${{ matrix.jit_flags || '' }}
          ${{ matrix.llvm && '-DBUILD_AOT_COMPILER=ON' || '' }}
          ${{ matrix.desktop && format('-DBINARYEN_ROOT={0}/binaryen-install', github.workspace) || '' }}
          ${{ matrix.flags }}

      # --- Android ---

      - name: Configure CMake (Android)
        if: matrix.android
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=16 \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_STL=none \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            ${{ matrix.flags }}

      # --- Emscripten ---

      - name: Configure CMake (Emscripten)
        if: matrix.emscripten
        run: emcmake cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      # --- Build / Test / Install ---

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: matrix.test
        working-directory: build
        run: ctest -C Release -V

      - name: Install (Standard)
        if: "!matrix.ios"
        run: cmake --install build --config Release --prefix dist

      - name: Install (iOS)
        if: matrix.ios
        run: cmake --build build --config Release --parallel --target install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist

  # ---------------------------------------------------------------
  # Combine macOS arm64 + x86_64 into a universal binary via lipo
  # ---------------------------------------------------------------
  macos-universal:
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fast-interp
          - variant: llvm-jit
    name: "macOS universal (${{ matrix.variant }})"
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: macos-arm64-${{ matrix.variant }}
          path: dist-arm64

      - uses: actions/download-artifact@v6
        with:
          name: macos-x64-${{ matrix.variant }}
          path: dist-x64

      - name: Create universal binaries
        run: |
          mkdir -p dist/lib dist/include
          # Combine each .dylib and .a found in arm64 dist
          for f in dist-arm64/lib/*.dylib dist-arm64/lib/*.a; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ -f "dist-x64/lib/$base" ]; then
              lipo -create "$f" "dist-x64/lib/$base" -output "dist/lib/$base"
              echo "lipo: $base"
              lipo -info "dist/lib/$base"
            else
              cp "$f" "dist/lib/$base"
              echo "copy (arm64 only): $base"
            fi
          done
          # Copy headers from arm64 (identical across architectures)
          cp -R dist-arm64/include/* dist/include/ 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal-${{ matrix.variant }}
          path: dist
