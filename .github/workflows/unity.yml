name: unity

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  WAMR_FAST_JIT: ON

jobs:
  # ---------------------------------------------------------------
  # Build LLVM libraries (cached, shared with unity_aot.yml)
  # ---------------------------------------------------------------
  build-llvm:
    uses: ./.github/workflows/build_llvm_libraries.yml

  # ---------------------------------------------------------------
  # Build binaryen (cached, shared with unity_aot.yml)
  # ---------------------------------------------------------------
  build-binaryen:
    uses: ./.github/workflows/build_binaryen.yml

  # ---------------------------------------------------------------
  # Build WAMR runtime + binaryen for all platforms
  # ---------------------------------------------------------------
  build:
    needs: [build-llvm, build-binaryen]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      ZERO_AR_DATE: 1
      SOURCE_DATE_EPOCH: 0
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Desktop ---
          - name: "Linux (GCC)"
            artifact: "linux-x64"
            os: ubuntu-22.04
            desktop: true
            flags: "-GNinja"
            test: true
          - name: "macOS (Clang)"
            artifact: "macos-universal"
            cache_key: "macos-arm64"
            os: macos-15
            desktop: true
            xcode: '16.4'
          - name: "Windows (MSVC)"
            artifact: "windows-x64"
            os: windows-2022
            desktop: true
            shell: pwsh
            flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON"
            test: true
          # --- Android ---
          - name: Android (arm64-v8a)
            artifact: "android-arm64"
            os: ubuntu-22.04
            android: true
            abi: "arm64-v8a"
          - name: Android (armeabi-v7a)
            artifact: "android-armv7"
            os: ubuntu-22.04
            android: true
            abi: "armeabi-v7a"
            flags: "-DANDROID_ARM_NEON=ON"
          - name: Android (x86)
            artifact: "android-x86"
            os: ubuntu-22.04
            android: true
            abi: "x86"
          - name: Android (x86_64)
            artifact: "android-x86_64"
            os: ubuntu-22.04
            android: true
            abi: "x86_64"

          # --- iOS ---
          - name: iOS
            artifact: "ios-arm64"
            os: macos-15
            ios: true
            xcode: '16.4'
            flags: >-
              -GXcode
              -DCMAKE_SYSTEM_NAME=iOS
              "-DCMAKE_OSX_ARCHITECTURES=arm64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
              -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO
              -DCMAKE_IOS_INSTALL_COMBINED=NO
              -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

          # --- Web (Emscripten) ---
          - name: Emscripten (wasm32)
            artifact: "emscripten-wasm"
            os: ubuntu-22.04
            emscripten: true

    steps:
      - name: Setup Xcode
        if: matrix.xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set Deterministic Environment
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Set up NDK
        if: matrix.android
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r23b

      - name: Set up Emscripten
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.8

      # --- Restore pre-built dependencies (desktop only) ---

      - name: Restore LLVM cache
        if: matrix.desktop
        uses: actions/cache/restore@v5
        with:
          path: |
            wamr/core/deps/llvm/build/bin
            wamr/core/deps/llvm/build/include
            wamr/core/deps/llvm/build/lib
            wamr/core/deps/llvm/build/libexec
            wamr/core/deps/llvm/build/share
          key: llvm-${{ matrix.cache_key || matrix.artifact }}-${{ needs.build-llvm.outputs.llvm_branch }}
          fail-on-cache-miss: true

      - name: Restore binaryen cache
        if: matrix.desktop
        uses: actions/cache/restore@v5
        with:
          path: binaryen-install
          key: binaryen-${{ matrix.cache_key || matrix.artifact }}-${{ needs.build-binaryen.outputs.binaryen_version }}
          fail-on-cache-miss: true

      # --- Standard (Linux, Windows, macOS) ---

      - name: Configure CMake (Standard)
        if: "!matrix.android && !matrix.emscripten"
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/dist
          ${{ matrix.desktop && format('-DWAMR_BUILD_FAST_JIT={0}', env.WAMR_FAST_JIT) || '' }}
          ${{ matrix.desktop && '-DWAMR_BUILD_AOT_COMPILER=ON' || '' }}
          ${{ matrix.desktop && format('-DBINARYEN_ROOT={0}/binaryen-install', github.workspace) || '' }}
          ${{ matrix.flags }}

      # --- Android ---

      - name: Configure CMake (Android)
        if: matrix.android
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=16 \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_STL=none \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            ${{ matrix.flags }}

      # --- Emscripten ---

      - name: Configure CMake (Emscripten)
        if: matrix.emscripten
        run: emcmake cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      # --- Build / Test / Install ---

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: matrix.test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Install (Standard)
        if: "!matrix.ios"
        run: cmake --install build --config Release --prefix dist

      - name: Install (iOS)
        if: matrix.ios
        run: cmake --build build --config Release --parallel --target install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
